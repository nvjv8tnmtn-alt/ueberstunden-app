<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f2c500"><link rel="manifest" href="manifest.json"><title>Überstunden</title><style>body{font-family:system-ui;margin:0;background:#f5f6f8;color:#171717}header{background:#111;color:#fff;padding:20px;border-bottom:5px solid #f2c500}main{max-width:900px;margin:auto;padding:16px}.card{background:#fff;padding:16px;border-radius:14px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}input,select,button{box-sizing:border-box;width:100%;max-width:100%;min-width:0;padding:11px;border:1px solid #ccc;border-radius:9px;font:inherit}button{background:#f2c500;border:0;font-weight:700}label{font-size:13px;font-weight:600;display:flex;flex-direction:column;gap:6px;min-width:0}.grid{align-items:end}.card h2{margin-top:0}.card{overflow:hidden}@media(max-width:700px){main{padding:10px}.card{padding:14px}.grid{grid-template-columns:1fr;gap:14px}.grid label:nth-child(n){grid-column:auto}input,select,button{font-size:16px;padding:12px 10px}input[type="date"],input[type="time"]{width:100%;min-width:0;display:block}}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}.scroll{overflow:auto}@media print{@page{size:A4 landscape;margin:12mm} header,.card:nth-of-type(1),.card:nth-of-type(2),.card:nth-of-type(3) button,td:last-child,th:last-child{display:none!important}body{background:#fff}.card{box-shadow:none}} </style></head><body><header><h1>Überstunden</h1></header><main><section class="card"><h2>Einstellungen</h2><div class="grid"><label>Stundenlohn €<input id="wage" type="number" value="18" step=".01"></label><label>25 % steuerpflichtig<input id="p25" type="number" value="25"></label><label>25 % steuerfrei<input id="p25f" type="number" value="25"></label><label>40 % steuerfrei<input id="p40" type="number" value="40"></label><label>Sonntag/Feiertag %<input id="p50" type="number" value="50"></label><label>Bereitschaft €<input id="sbRate" type="number" value="15"></label></div></section><section class="card"><h2>Neuer Eintrag</h2><div class="grid"><label>Datum<input id="date" type="date"></label><label>Beginn<input id="start" type="time"></label><label>Ende<input id="end" type="time"></label><label>REG-Nummer<input id="reg"></label><label>Kennzeichen<input id="plate"></label><label>Bereitschaft<select id="sb"><option value="0">Nein</option><option value="1">Ja (+ Bereitschaft/Tag)</option></select></label><label>25 % steuerfrei – Stunden<input id="free25" type="number" value="0" step=".25"></label></div><br><button id="save">Eintrag speichern</button><input id="editIndex" type="hidden" value="-1"><button id="cancelEdit" type="button" style="display:none;margin-top:8px">Bearbeiten abbrechen</button></section><section class="card report"><h2>Abrechnung <span id="monthLabel"></span></h2><div class="grid"><div><b>Gesamtstunden</b><div id="sumHours">0,00 h</div></div><div><b>Grundlohn</b><div id="sumBase">0,00 €</div></div><div><b>25 % steuerpflichtig</b><div id="sum25">0,00 €</div></div><div><b>25 % steuerfrei</b><div id="sum25f">0,00 €</div></div><div><b>40 % steuerfrei</b><div id="sum40">0,00 €</div></div><div><b>50 % So./Feiertag</b><div id="sum50">0,00 €</div></div><div><b>Bereitschaft</b><div id="sumSb">0,00 €</div></div></div><h2>Gesamt: <span id="total">0,00 €</span></h2><div class="scroll"><table><thead><tr><th>Datum</th><th>Zeit</th><th>REG</th><th>Kennzeichen</th><th>Std.</th><th>Gesamt</th><th>Aktion</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>
const S=["wage","p25","p25f","p40","p50","sbRate"],$=x=>document.getElementById(x);let E=JSON.parse(localStorage.getItem("entries")||"[]"),cfg=JSON.parse(localStorage.getItem("cfg")||"{}");S.forEach(x=>{if(cfg[x]!=null)$(x).value=cfg[x];$(x).onchange=()=>{cfg={};S.forEach(y=>cfg[y]=+$(y).value||0);localStorage.setItem("cfg",JSON.stringify(cfg));render()}});function m(t){let x=t.split(":").map(Number);return x[0]*60+x[1]}
function addDays(d,n){let x=new Date(d+"T12:00");x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)}
function easter(y){let a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=(h+l-7*m+114)%31+1;return y+"-"+String(mo).padStart(2,"0")+"-"+String(da).padStart(2,"0")}
function holiday(d){let y=+d.slice(0,4),es=easter(y),H={[y+"-01-01"]:1,[y+"-05-01"]:1,[y+"-08-15"]:1,[y+"-10-03"]:1,[y+"-11-01"]:1,[y+"-12-25"]:1,[y+"-12-26"]:1};[-2,1,39,50,60].forEach(n=>H[addDays(es,n)]=1);return !!H[d]}
function calc(e){let w=+$("wage").value||0,sbv=e.sb?(+$("sbRate").value||0):0;if(!e.s||!e.e)return{h:0,base:0,b25:0,b25f:0,b40:0,b50:0,sbv,t:sbv};let a=m(e.s),b=m(e.e);if(b<=a)b+=1440;let h=(b-a)/60,h25=0,h40=0,h50=0;for(let q=a;q<b;q++){let day=Math.floor(q/1440),min=q%1440,dt=addDays(e.d,day),special=new Date(dt+"T12:00").getDay()===0||holiday(dt);if(special)h50+=1/60;else if(min<240)h40+=1/60;else if((min>=240&&min<480)||min>=1020)h25+=1/60}let base=h*w,b25=h25*w*(+$("p25").value||0)/100,b25f=(+e.f||0)*w*(+$("p25f").value||0)/100,b40=h40*w*(+$("p40").value||0)/100,b50=h50*w*(+$("p50").value||0)/100,t=base+b25+b25f+b40+b50+sbv;return{h,base,b25,b25f,b40,b50,sbv,t}}
function eur(n){return n.toLocaleString("de-DE",{style:"currency",currency:"EUR"})}
function render(){let z={h:0,base:0,b25:0,b25f:0,b40:0,b50:0,sbv:0,t:0};$("rows").innerHTML=E.map((e,i)=>{let x=calc(e);Object.keys(z).forEach(k=>z[k]+=x[k]);return "<tr><td>"+e.d+(holiday(e.d)?" 🎉":"")+"</td><td>"+(e.s&&e.e?e.s+"–"+e.e:"Bereitschaft")+"</td><td>"+(e.r||"")+"</td><td>"+(e.p||"")+"</td><td>"+x.h.toFixed(2)+"</td><td>"+eur(x.t)+"</td><td><button onclick='editEntry("+i+")'>✏️</button><button onclick='del("+i+")'>×</button></td></tr>"}).join("");$("sumHours").textContent=z.h.toFixed(2)+" h";$("sumBase").textContent=eur(z.base);$("sum25").textContent=eur(z.b25);$("sum25f").textContent=eur(z.b25f);$("sum40").textContent=eur(z.b40);$("sum50").textContent=eur(z.b50);$("sumSb").textContent=eur(z.sbv);$("total").textContent=eur(z.t)}
function editEntry(i){let e=E[i];$("date").value=e.d;$("start").value=e.s||"";$("end").value=e.e||"";$("reg").value=e.r||"";$("plate").value=e.p||"";$("sb").value=e.sb?"1":"0";$("free25").value=e.f||0;$("editIndex").value=i;$("save").textContent="Änderung speichern";$("cancelEdit").style.display="block";scrollTo({top:0,behavior:"smooth"})}
function resetEdit(){$("editIndex").value=-1;$("save").textContent="Eintrag speichern";$("cancelEdit").style.display="none";["date","start","end","reg","plate"].forEach(x=>$(x).value="");$("sb").value="0";$("free25").value=0}
$("cancelEdit").onclick=resetEdit;
function del(i){E.splice(i,1);localStorage.setItem("entries",JSON.stringify(E));render()}
$("save").onclick=()=>{let onlySb=$("sb").value==="1"&&!$("start").value&&!$("end").value;if(!$("date").value){alert("Bitte ein Datum eintragen.");return}if(!onlySb&&(!$("start").value||!$("end").value)){alert("Bitte Beginn und Ende eintragen – oder für reine Bereitschaft nur Bereitschaft auf Ja stellen.");return}let e={d:$("date").value,s:onlySb?"":$("start").value,e:onlySb?"":$("end").value,r:$("reg").value,p:$("plate").value,sb:$("sb").value==="1",f:+$("free25").value||0},i=+$("editIndex").value;if(i>=0)E[i]=e;else E.push(e);localStorage.setItem("entries",JSON.stringify(E));resetEdit();render()};
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));render();</script></body></html>
