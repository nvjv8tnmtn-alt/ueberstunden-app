<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f2c500"><link rel="manifest" href="manifest.json"><title>Überstunden</title><style>body{font-family:system-ui;margin:0;background:#f5f6f8;color:#171717}header{background:#111;color:#fff;padding:20px;border-bottom:5px solid #f2c500}main{max-width:900px;margin:auto;padding:16px}.card{background:#fff;padding:16px;border-radius:14px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}input,select,button{box-sizing:border-box;width:100%;padding:11px;border:1px solid #ccc;border-radius:9px;font:inherit}button{background:#f2c500;border:0;font-weight:700}label{font-size:13px;font-weight:600}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}.scroll{overflow:auto}@media print{@page{size:A4 landscape;margin:12mm} header,.card:nth-of-type(1),.card:nth-of-type(2),.card:nth-of-type(3) button,td:last-child,th:last-child{display:none!important}body{background:#fff}.card{box-shadow:none}} </style></head><body><header><h1>Überstunden</h1></header><main><section class="card"><h2>Einstellungen</h2><div class="grid"><label>Stundenlohn €<input id="wage" type="number" value="18" step=".01"></label><label>25 % steuerpflichtig<input id="p25" type="number" value="25"></label><label>25 % steuerfrei<input id="p25f" type="number" value="25"></label><label>40 % steuerfrei<input id="p40" type="number" value="40"></label><label>Sonntag/Feiertag %<input id="p50" type="number" value="50"></label><label>Bereitschaft €<input id="sbRate" type="number" value="15"></label></div></section><section class="card"><h2>Neuer Eintrag</h2><div class="grid"><label>Datum<input id="date" type="date"></label><label>Beginn<input id="start" type="time"></label><label>Ende<input id="end" type="time"></label><label>REG-Nummer<input id="reg"></label><label>Kennzeichen<input id="plate"></label><label>Bereitschaft<select id="sb"><option value="0">Nein</option><option value="1">Ja (+ Bereitschaft/Tag)</option></select></label><label>25 % steuerfrei – Stunden<input id="free25" type="number" value="0" step=".25"></label></div><br><button id="save">Eintrag speichern</button></section><section class="card report"><h2>Abrechnung <span id="monthLabel"></span></h2><div class="grid"><div><b>Gesamtstunden</b><div id="sumHours">0,00 h</div></div><div><b>Grundlohn</b><div id="sumBase">0,00 €</div></div><div><b>25 % steuerpflichtig</b><div id="sum25">0,00 €</div></div><div><b>25 % steuerfrei</b><div id="sum25f">0,00 €</div></div><div><b>40 % steuerfrei</b><div id="sum40">0,00 €</div></div><div><b>50 % So./Feiertag</b><div id="sum50">0,00 €</div></div><div><b>Bereitschaft</b><div id="sumSb">0,00 €</div></div></div><h2>Gesamt: <span id="total">0,00 €</span></h2><div class="scroll"><table><thead><tr><th>Datum</th><th>Zeit</th><th>REG</th><th>Kennzeichen</th><th>Std.</th><th>Gesamt</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>
const S=["wage","p25","p25f","p40","p50","sbRate"],$=x=>document.getElementById(x);let E=JSON.parse(localStorage.getItem("entries")||"[]"),cfg=JSON.parse(localStorage.getItem("cfg")||"{}");S.forEach(x=>{if(cfg[x]!=null)$(x).value=cfg[x];$(x).onchange=()=>{cfg={};S.forEach(y=>cfg[y]=+$(y).value||0);localStorage.setItem("cfg",JSON.stringify(cfg));render()}});function m(t){let x=t.split(":").map(Number);return x[0]*60+x[1]}function ov(a,b,c,d){return Math.max(0,Math.min(b,d)-Math.max(a,c))/60}function calc(e){let w=+$("wage").value||0;if(!e.s||!e.e){let sbv=e.sb?(+$("sbRate").value||0):0;return{h:0,base:0,b25:0,b25f:0,b40:0,b50:0,sbv,t:sbv}}let a=m(e.s),b=m(e.e);if(b<=a)b+=1440;let h=(b-a)/60,sun=new Date(e.d+"T12:00").getDay()===0,h25=0,h40=0,h50=0;if(sun)h50=h;else{h40=ov(a,b,0,240)+ov(a,b,1440,1680);h25=ov(a,b,240,480)+ov(a,b,1020,1440)+ov(a,b,1680,1920)}let base=h*w,b25=h25*w*(+$("p25").value||0)/100,b25f=(+e.f||0)*w*(+$("p25f").value||0)/100,b40=h40*w*(+$("p40").value||0)/100,b50=h50*w*(+$("p50").value||0)/100,sbv=e.sb?(+$("sbRate").value||0):0,t=base+b25+b25f+b40+b50+sbv;return{h,base,b25,b25f,b40,b50,sbv,t}}function eur(n){return n.toLocaleString("de-DE",{style:"currency",currency:"EUR"})}function render(){let sum=0;$("rows").innerHTML=E.map((e,i)=>{let c=calc(e);sum+=c[1];return "<tr><td>"+e.d+"</td><td>"+(e.s&&e.e?e.s+"–"+e.e:"Bereitschaft")+"</td><td>"+e.r+"</td><td>"+e.p+"</td><td>"+c[0].toFixed(2)+"</td><td>"+eur(c[1])+"</td><td><button onclick='del("+i+")'>×</button></td></tr>"}).join("");$("total").textContent=eur(sum)}function del(i){E.splice(i,1);localStorage.setItem("entries",JSON.stringify(E));render()}$("save").onclick=()=>{let onlySb=$("sb").value==="1"&&!$("start").value&&!$("end").value;if(!$("date").value){alert("Bitte ein Datum eintragen.");return}if(!onlySb&&(!$("start").value||!$("end").value)){alert("Bitte Beginn und Ende eintragen – oder für reine Bereitschaft nur Bereitschaft auf Ja stellen.");return}E.push({d:$("date").value,s:onlySb?"":$("start").value,e:onlySb?"":$("end").value,r:$("reg").value,p:$("plate").value,sb:$("sb").value==="1",f:+$("free25").value||0});localStorage.setItem("entries",JSON.stringify(E));render()};if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));render();</script></body></html>
