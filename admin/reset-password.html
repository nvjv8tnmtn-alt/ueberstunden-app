<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Passwort zurücksetzen – Überstunden</title><style>*{box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#080b0e;color:#f5f5f5;margin:0}main{max-width:480px;margin:9vh auto;padding:24px;background:#151b20;border:1px solid #454b50;border-radius:16px}h1{color:#ffd000;font-size:26px}label{display:block;margin:16px 0}input{display:block;width:100%;padding:13px;margin-top:7px;border-radius:8px;border:1px solid #777;font-size:16px}button{background:#ffd000;border:0;border-radius:9px;padding:13px 20px;font-weight:700;font-size:16px}a{color:#ffd000}#message{line-height:1.5}</style></head><body><main><h1>🔐 Neues Passwort festlegen</h1><p id="message">Wiederherstellungslink wird geprüft …</p><form id="form" hidden><label>Neues Passwort<input id="password" type="password" minlength="12" autocomplete="new-password" required></label><label>Passwort wiederholen<input id="repeat" type="password" minlength="12" autocomplete="new-password" required></label><button id="submit" type="submit">Passwort speichern</button></form><p><a href="./">Zur Admin-Anmeldung</a></p></main><script>
"use strict";
const base="https://stkbvwxewedjpfhmtmzx.supabase.co",key="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN0a2J2d3hld2VkanBmaG10bXp4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUwNzYxNzIsImV4cCI6MjExMDY1MjE3Mn0.iywRajexZz3rJn4Oh9UmbGxNKN88wqlCbiynfzzob7A";
const $=x=>document.getElementById(x);let token=null;
async function request(path,body){const res=await fetch(base+path,{method:"POST",headers:{"apikey":key,"Content-Type":"application/json"},body:JSON.stringify(body)});const data=await res.json().catch(()=>({}));if(!res.ok)throw Error(data.msg||data.error_description||data.message||"Anfrage fehlgeschlagen");return data}
(async()=>{try{const hash=new URLSearchParams(location.hash.slice(1)),query=new URLSearchParams(location.search);if(hash.get("error"))throw Error(hash.get("error_description")||hash.get("error"));if(hash.get("type")==="recovery"&&hash.get("access_token")){token=hash.get("access_token")}else if(query.get("token_hash")&&query.get("type")==="recovery"){const result=await request("/auth/v1/verify",{token_hash:query.get("token_hash"),type:"recovery"});token=result.access_token}else if(query.get("code")){throw Error("Dieser Link verwendet einen nicht unterstützten Code-Austausch. Bitte den Wiederherstellungslink mit token_hash oder Fragment verwenden.")}else{throw Error("Kein gültiger Wiederherstellungslink gefunden. Bitte einen neuen Link anfordern.")}history.replaceState(null,"",location.pathname);$("message").textContent="Bitte lege ein neues Passwort mit mindestens 12 Zeichen fest.";$("form").hidden=false}catch(e){$("message").textContent=e.message}})();
$("form").addEventListener("submit",async e=>{e.preventDefault();if($("password").value!==$("repeat").value){$("message").textContent="Die Passwörter stimmen nicht überein.";return}if(!token){$("message").textContent="Wiederherstellungssitzung fehlt.";return}const btn=$("submit");btn.disabled=true;try{const res=await fetch(base+"/auth/v1/user",{method:"PUT",headers:{"apikey":key,"Authorization":"Bearer "+token,"Content-Type":"application/json"},body:JSON.stringify({password:$("password").value})});const data=await res.json().catch(()=>({}));if(!res.ok)throw Error(data.msg||data.message||"Passwort konnte nicht gespeichert werden.");token=null;$("form").hidden=true;$("password").value="";$("repeat").value="";$("message").textContent="Passwort erfolgreich geändert. Du kannst dich jetzt im Adminbereich anmelden."}catch(err){$("message").textContent=err.message}finally{btn.disabled=false}});
</script></body></html>
